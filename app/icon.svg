<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Favicon: the ANVIKSHA "A" as an 8-bit glyph, in the brochure's heading
       colours — cyan fill, magenta offset. Hand-drawn as blocks rather than
       set in Press Start 2P so the icon ships as source, not a downloaded
       font, and stays crisp at 16px. -->
  <rect width="32" height="32" fill="#08090d" />

  <!-- magenta offset, one pixel down-right of the fill -->
  <g fill="#ff2e7e">
    <rect x="13" y="7" width="8" height="4" />
    <rect x="9" y="11" width="4" height="4" />
    <rect x="21" y="11" width="4" height="4" />
    <rect x="9" y="15" width="16" height="4" />
    <rect x="9" y="19" width="4" height="6" />
    <rect x="21" y="19" width="4" height="6" />
  </g>

  <g fill="#4ce0ff">
    <rect x="12" y="6" width="8" height="4" />
    <rect x="8" y="10" width="4" height="4" />
    <rect x="20" y="10" width="4" height="4" />
    <rect x="8" y="14" width="16" height="4" />
    <rect x="8" y="18" width="4" height="6" />
    <rect x="20" y="18" width="4" height="6" />
  </g>
</svg>
